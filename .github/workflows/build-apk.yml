name: Build PySide6 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-17-jdk \
            git \
            wget \
            unzip

      - name: Install PySide6
        run: |
          python -m pip install --upgrade pip
          pip install PySide6

      - name: Install Android deployment dependencies
        run: |
          pip install -r \
            "$(python -c 'import PySide6, os; print(os.path.join(os.path.dirname(PySide6.__file__), "scripts", "requirements-android.txt"))')"

      - name: Download Android PySide6 wheels
        run: |
          mkdir -p wheels

          pip download \
            --only-binary=:all: \
            --platform manylinux_2_28_x86_64 \
            --python-version 3.11 \
            --implementation cp \
            --abi cp311 \
            PySide6-Essentials \
            -d wheels

      - name: List wheels
        run: |
          ls -lh wheels

      - name: Build APK
        run: |
          PYSIDE_WHEEL=$(find wheels -name "PySide6_Essentials*.whl" | head -n 1)
          SHIBOKEN_WHEEL=$(find wheels -name "shiboken6*.whl" | head -n 1)

          echo "PySide wheel: $PYSIDE_WHEEL"
          echo "Shiboken wheel: $SHIBOKEN_WHEEL"

          pyside6-android-deploy \
            --name "Rastgele Sayi Uretici" \
            --wheel-pyside "$PYSIDE_WHEEL" \
            --wheel-shiboken "$SHIBOKEN_WHEEL" \
            main.py

      - name: Find APK
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rastgele-Sayi-Uretici-APK
          path: "**/*.apk"
