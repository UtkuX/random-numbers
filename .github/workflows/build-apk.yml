name: Build PySide6 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-17-jdk \
            git \
            wget \
            unzip

      - name: Install PySide6
        run: |
          python -m pip install --upgrade pip
          pip install PySide6

      - name: Install Android deployment dependencies
        run: |
          pip install -r \
            "$(python -c 'import PySide6, os; print(os.path.join(os.path.dirname(PySide6.__file__), "scripts", "requirements-android.txt"))')"

      - name: Check deployment tool
        run: |
          pyside6-android-deploy --help

      - name: Build APK
        run: |
          pyside6-android-deploy \
            --name "Rastgele Sayi Uretici" \
            main.py

      - name: Find APK
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rastgele-Sayi-Uretici-APK
          path: "**/*.apk"
